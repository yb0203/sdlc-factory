[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-factory"
version = "0.1.0"
description = "Domain-Model Centric SDLC Factory powered by agy SDK"
readme = "README.md"
authors = [{ name = "Software Factory Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "click>=8.0.0",
    "z3-solver>=4.12.0",
]

[project.scripts]
af = "sdlc_factory.cli:main"
agy-factory = "sdlc_factory.cli:main"

[tool.setuptools.packages.find]
include = ["sdlc_factory*", "schemas*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
